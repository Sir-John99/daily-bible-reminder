name: Send Daily Bible Reminder

on:
  schedule:
    # Wake up early at 9:00 PM UTC / GMT the night before to beat the queue delays
    - cron: '0 21 * * *'
  workflow_dispatch: 

jobs:
  send_reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Run script to send WhatsApp message
        env:
          GREEN_API_ID: ${{ secrets.GREEN_API_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
        run: python script.py
